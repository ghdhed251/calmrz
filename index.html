<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLKNPL · 2026–27 Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tab-1: #5ad2ff;
    --tab-2: #c084ff;
    --tab-3: #7dff7a;
    --tab-4: #ffe566;
    --tab-5: #ff7ad9;
    --tab-6: #ff8a3d;
    --wash-1: #4d6573;
    --wash-2: #5a5668;
    --wash-3: #3f6a58;
    --wash-4: #6a6140;
    --wash-5: #6e4a56;
    --wash-6: #6d5a46;
    --bright: #d4c48a;
    --bright-2: #8eb8c8;
    --bg: #17151d;
    --month-card: #3d4a56;
    --paper: #ffffff;
    --ink: #1c1430;
    --muted: #8a96a2;
    --line: rgba(255,255,255,.16);
    --weekend: #5a5668;
    --holiday: #c43d6a;
    --holiday-ink: #ffe566;
    --special: #e07030;
    --special-ink: #fff4e0;
    --exam: #c9a227;
    --exam-ink: #fff8e0;
    --today: #1c1430;
    --d: #3b3358;
    --d1: #5b2dff;
    --panel: #2f3a44;
    --accent: #ff7ad9;
    --pe: #5ad2ff;
    --month-ink: rgba(18, 14, 32, 0.24);
    --header-h: 52px;
    --weekdays-h: 36px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Outfit", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }

  .app {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  /* Landscape: panel on the right */
  @media (min-aspect-ratio: 1/1) {
    .body { flex-direction: row; }
  }

  header.top {
    flex: 0 0 auto;
    min-height: var(--header-h);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6px 10px 0;
    background:
      radial-gradient(120% 180% at 0% 0%, rgba(90,210,255,.22), transparent 42%),
      radial-gradient(90% 140% at 100% 0%, rgba(255,122,217,.2), transparent 46%),
      #17151d;
    border-bottom: none;
    z-index: 5;
    gap: 6px;
    color: #fff8e8;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px 12px;
    flex-wrap: wrap;
  }
  .month-nav {
    display: flex;
    align-items: flex-end;
    gap: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 -10px;
    padding: 8px 10px 0;
    background: transparent;
    position: relative;
  }
  .month-nav::-webkit-scrollbar { display: none; }
  .month-nav::before {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    top: 8px;
    bottom: 0;
    background: #2a2436;
    border-radius: 10px 10px 0 0;
    z-index: 0;
    pointer-events: none;
  }
  .month-thumb {
    position: absolute;
    left: 0;
    bottom: 0;
    z-index: 1;
    background: var(--month-card);
    border-radius: 10px 10px 0 0;
    pointer-events: none;
    will-change: transform, width;
  }
  .month-nav button {
    flex: 1 1 0;
    min-width: 0;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #f0e6ff;
    padding: 10px 4px 8px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    text-align: center;
    box-shadow: none;
    position: relative;
    z-index: 2;
  }
  .month-nav button:nth-child(6n+1) { color: var(--tab-1); }
  .month-nav button:nth-child(6n+2) { color: var(--tab-2); }
  .month-nav button:nth-child(6n+3) { color: var(--tab-3); }
  .month-nav button:nth-child(6n+4) { color: var(--tab-4); }
  .month-nav button:nth-child(6n+5) { color: var(--tab-5); }
  .month-nav button:nth-child(6n+6) { color: var(--tab-6); }
  .month-nav button:hover {
    filter: brightness(1.12);
  }
  .month-nav button.on {
    background: transparent;
    color: #eef2f5;
    font-weight: 800;
    box-shadow: none;
  }
  .month-nav button.on:nth-child(6n+1) { color: var(--tab-1); }
  .month-nav button.on:nth-child(6n+2) { color: var(--tab-2); }
  .month-nav button.on:nth-child(6n+3) { color: var(--tab-3); }
  .month-nav button.on:nth-child(6n+4) { color: var(--tab-4); }
  .month-nav button.on:nth-child(6n+5) { color: var(--tab-5); }
  .month-nav button.on:nth-child(6n+6) { color: var(--tab-6); }

  header.top h1 {
    font-size: clamp(13px, 1.4vw, 18px);
    font-weight: 650;
    letter-spacing: 0.01em;
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
    color: inherit;
    padding: 0;
    line-height: 1.15;
  }
  header.top h1:hover { color: #ffe566; }
  header.top .sub {
    font-weight: 400;
    color: var(--muted);
    margin-left: 8px;
    font-size: 12px;
  }
  .tt-now {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 2px;
    min-width: 0;
    flex: 1 1 auto;
  }
  .tt-now .meta {
    font-size: clamp(22px, 3.4vw, 34px);
    font-weight: 750;
    color: #fff8e8;
    letter-spacing: -0.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  @media (max-width: 720px) {
    .tt-now {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 14px;
    }
    .tt-now .meta { font-size: clamp(18px, 4.6vw, 28px); }
  }
  @media (max-height: 520px) {
    .tt-now {
      flex-direction: row;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 14px;
    }
    .tt-now .meta { font-size: clamp(18px, 3vw, 26px); }
  }
  .legend {
    display: flex;
    gap: 10px;
    font-size: 10px;
    color: #d9c9f0;
    align-items: center;
    flex: 0 0 auto;
  }
  .view-switch {
    display: flex;
    align-items: center;
    background: #2a2436;
    border-radius: 99px;
    padding: 2px;
    gap: 2px;
  }
  .view-btn {
    border: none;
    background: transparent;
    color: #d9c9f0;
    font-family: inherit;
    font-size: 12px;
    font-weight: 650;
    padding: 5px 11px;
    border-radius: 99px;
    cursor: pointer;
    line-height: 1.2;
  }
  .view-btn:hover { color: #fff8e8; }
  .view-btn.on {
    background: var(--month-card);
    color: #5ad2ff;
  }
  .app.view-tt .cal-wrap { display: none !important; }
  .cal-wrap, .tt-overlay { order: 1; }
  .panel { order: 2; }
  .swatch {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: -1px;
    border: 1px solid rgba(0,0,0,.08);
  }
  .swatch.wknd { background: var(--weekend); }
  .swatch.hol { background: var(--holiday); }
  .swatch.exam { background: var(--exam); }
  .swatch.spc { background: var(--special); }

  .cal-wrap {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: var(--month-card);
    container-type: inline-size;
    container-name: calboard;
  }

  .months { padding: 8px 8px 28px; }

  .month {
    display: block;
    position: relative;
    margin: 0;
    padding: 8px 6px 16px;
    background: transparent;
    border-radius: 0;
  }
  .month-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8eb8c8;
    padding: 6px 4px 8px;
  }
  .month-bg {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(160px, 58cqi, 340px);
    font-weight: 800;
    letter-spacing: -0.08em;
    line-height: 0.78;
    color: var(--month-ink);
    pointer-events: none;
    user-select: none;
    font-variant-numeric: tabular-nums;
  }
  .grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 3px;
  }

  .cell {
    min-height: 72px;
    min-width: 0;
    overflow: hidden;
    background-color: var(--paper);
    border-radius: 10px;
    padding: 5px 4px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    cursor: pointer;
    position: relative;
    border: 1px solid transparent;
    transition: transform .12s ease, box-shadow .12s ease, outline-color .12s ease;
    container-type: inline-size;
    container-name: daycell;
  }
  .cell.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
  .cell:not(.empty):active { transform: scale(0.97); }
  .cell:not(.empty):not(.weekend):not(.holiday):not(.special):not(.exam) {
    background-color: var(--wash-1);
  }
  .cell.weekend { background-color: var(--weekend); }
  .cell.holiday { background-color: var(--holiday); }
  .cell.special { background-color: var(--special); }
  .cell.exam { background-color: var(--exam); }
  .cell.selected {
    border-color: #ffb3ec;
    box-shadow:
      0 0 0 3px #ff7ad9,
      0 0 0 7px rgba(255,122,217,.32),
      0 10px 22px rgba(255,122,217,.28);
    z-index: 4;
  }
  .cell.selected .date-n {
    color: #ffe6f8;
    font-weight: 800;
  }
  .cell.today {
    outline: 2px solid #5ad2ff;
    outline-offset: -2px;
  }
  .cell.today.selected {
    outline-offset: 3px;
  }
  .cell.range-hl {
    box-shadow: 0 0 0 2px #ff8a3d;
    z-index: 2;
  }

  .date-n {
    font-size: clamp(12px, 11px + 2.4cqi, 16px);
    font-weight: 750;
    color: rgba(244,248,252,.94);
    align-self: flex-end;
    text-align: right;
    line-height: 1;
    position: relative;
    z-index: 3;
    min-width: 1.25em;
  }
  .cell.holiday .date-n { color: rgba(255,236,140,.95); }
  .cell.special .date-n { color: rgba(255,248,232,.95); }
  .cell.exam .date-n { color: rgba(255,250,220,.96); }

  .dnum {
    position: absolute;
    right: 2px;
    bottom: -2px;
    left: auto;
    top: auto;
    margin: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    pointer-events: none;
    z-index: 2;
  }
  .dnum .dpre { display: none; }
  .dnum .dn {
    font-size: clamp(36px, 24px + 16cqi, 66px);
    font-weight: 800;
    color: rgba(10, 16, 22, 0.58);
    letter-spacing: -0.08em;
    line-height: 0.82;
  }
  .dnum.d1 .dn {
    color: rgba(8, 22, 36, 0.6);
  }
  .cell.holiday .dnum .dn { color: rgba(42, 6, 16, 0.5); }
  .cell.special .dnum .dn { color: rgba(42, 16, 4, 0.5); }
  .cell.exam .dnum .dn { color: rgba(36, 28, 4, 0.52); }
  .mark {
    font-size: clamp(11px, 10px + 2.4cqi, 15px);
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1.1;
    color: var(--exam-ink);
    margin-top: 2px;
    align-self: flex-end;
    text-align: right;
  }
  .cell-note {
    display: -webkit-box;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    flex: 1 1 auto;
    box-sizing: border-box;
    margin-top: 4px;
    margin-bottom: 0;
    padding: 0 1.15em 2px 2px;
    font-size: clamp(10px, 8px + 4.2cqi, 15px);
    font-weight: 400;
    color: #dce6ec;
    text-align: left;
    white-space: normal;
    overflow: hidden;
    line-height: 1.25;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    line-clamp: 4;
  }
  .cell.holiday .cell-note { color: var(--holiday-ink); }
  .cell.exam .cell-note { color: var(--exam-ink); }

  .cell-icos {
    position: absolute;
    top: 3px;
    bottom: auto;
    left: auto;
    right: 1.7em;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: nowrap;
    gap: 2px;
    pointer-events: none;
    z-index: 2;
  }
  .cell:has(.cell-icos, .cell-wx) .cell-note { padding-top: 18px; }
  .date-n, .mark, .cell-note {
    position: relative;
    z-index: 1;
  }
  .cell-icos { z-index: 2; }
  .cell-wx {
    position: absolute;
    top: 3px;
    left: 3px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    pointer-events: none;
    z-index: 2;
  }
  .cell-wx .wx-icon {
    width: 33px;
    height: 33px;
    object-fit: contain;
    opacity: 1;
    filter: none;
  }
  @container daycell (max-width: 84px) {
    .pe-icon { width: 18px; height: 18px; }
    .badm-icon { width: 18px; height: 18px; }
    .jacket-icon, .shirt-icon { width: 17px; height: 17px; }
    .book-icon { width: 18px; height: 18px; }
    .book-letter { font-size: 12px; }
    .cell-icos { right: 1.55em; }
    .cell-note { -webkit-line-clamp: 3; line-clamp: 3; }
  }
  @media (max-width: 720px) {
    .cal-wrap .cell-note { display: none !important; }
    .cell:has(.cell-icos, .cell-wx) .cell-note { padding-top: 0; }
    .cell-icos {
      top: 26px;
      right: 3px;
      left: 3px;
      bottom: 4px;
      justify-content: center;
      align-items: center;
    }
  }
  @container calboard (max-width: 620px) {
    .cell-note { display: none !important; }
    .cell:has(.cell-icos, .cell-wx) .cell-note { padding-top: 0; }
    .cell-icos {
      top: 26px;
      right: 3px;
      left: 3px;
      bottom: 4px;
      justify-content: center;
      align-items: center;
    }
  }
  .pe-icon {
    width: 23px;
    height: 23px;
    object-fit: contain;
    display: block;
    flex: 0 0 auto;
  }
  .badm-icon {
    width: 23px;
    height: 23px;
    object-fit: contain;
    display: block;
    flex: 0 0 auto;
    filter: drop-shadow(0 0 1px rgba(255,255,255,.35));
  }
  .jacket-icon {
    width: 23px;
    height: 23px;
    object-fit: contain;
    display: block;
    flex: 0 0 auto;
  }
  .shirt-icon {
    width: 23px;
    height: 23px;
    object-fit: contain;
    display: block;
    flex: 0 0 auto;
  }
  .wx-icon {
    width: 20px;
    height: 20px;
    object-fit: contain;
    display: block;
  }
  .title-ico.wx-icon { width: 26px; height: 26px; margin-left: 0; vertical-align: middle; }
  .tt-table thead .wx-slot {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    height: clamp(18px, 3.2cqi, 36px);
    margin-top: 2px;
  }
  .tt-table thead .wx-icon {
    width: clamp(18px, 3.2cqi, 36px);
    height: clamp(18px, 3.2cqi, 36px);
  }
  .book-mark {
    display: flex;
    align-items: flex-end;
    gap: 1px;
    color: #1f9a4a;
    line-height: 1;
  }
  .book-icon { width: 25px; height: 25px; color: #1f9a4a; display: block; object-fit: contain; flex: 0 0 auto; }
  .book-letter {
    font-size: 12px;
    font-weight: 800;
    color: #1f9a4a;
    line-height: 1;
    padding-bottom: 1px;
  }
  .title-ico {
    display: inline-block;
    width: 26px;
    height: 26px;
    margin-left: 8px;
    vertical-align: -5px;
    position: static;
  }
  .title-ico.pe { color: var(--pe); }
  .title-ico.badm-icon { width: 26px; height: 26px; }
  .book-mark.title {
    position: static;
    display: inline-flex;
    align-items: center;
    margin-left: 8px;
    vertical-align: -4px;
    gap: 3px;
  }
  .book-mark.title .book-icon { width: 26px; height: 26px; }
  .book-mark.title .book-letter { font-size: 16px; }
  /* Panel */
  .grabber {
    flex: 0 0 auto;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .grabber:active { cursor: grabbing; }
  .grabber i {
    display: block;
    width: 36px;
    height: 5px;
    border-radius: 99px;
    background: #8eb8c8;
  }
  .panel {
    flex: 0 0 0;
    background: var(--panel);
    color: #fff8e8;
    border-top: 1px solid var(--line);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: flex-basis .38s cubic-bezier(.32,.72,.25,1);
    z-index: 6;
  }
  .panel.dragging { transition: none; }
  .app.open-panel .panel { flex-basis: min(46vh, 380px); }
  @media (min-aspect-ratio: 1/1) {
    .panel {
      border-top: none;
      border-left: 1px solid var(--line);
      position: relative;
    }
    .app.open-panel .panel { flex-basis: min(480px, 44vw); }
    .panel > .grabber {
      position: absolute;
      left: -5px;
      top: 0;
      bottom: 0;
      width: 12px;
      height: auto;
      transform: none;
      z-index: 3;
      cursor: ew-resize;
    }
    .panel > .grabber i { display: none; }
    .panel > .grabber:hover,
    .panel.dragging > .grabber {
      background: #8eb8c8;
    }
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 8px;
    gap: 8px;
    border-bottom: 3px solid #5ad2ff;
    background: #3d4a56;
    position: relative;
    overflow: hidden;
  }
  .panel-head-text { flex: 1 1 auto; min-width: 0; position: relative; z-index: 1; }
  .panel-head .close-btn { position: relative; z-index: 2; }
  .panel-wx {
    position: absolute;
    right: 56px;
    top: 50%;
    transform: translateY(-50%);
    width: 88px;
    height: 88px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
  }
  .panel-wx:empty { display: none; }
  .panel-wx .wx-icon {
    width: 88px;
    height: 88px;
    object-fit: contain;
    opacity: 0.92;
  }
  .panel-kicker { display: none; }
  .panel-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
    color: #e8eef2;
  }
  .panel-title .cyc-inline {
    font-size: 13px;
    font-weight: 750;
    color: #ff7ad9;
    margin-left: 8px;
    letter-spacing: 0.04em;
    vertical-align: middle;
  }
  .panel-sub {
    font-size: 12px;
    color: #8eb8c8;
    margin-top: 2px;
  }
  .panel-head-text {
    cursor: pointer;
  }
  .panel-head-text:hover .panel-title {
    color: #ffe566;
  }
  .panel-head-text:hover .panel-sub {
    color: #5ad2ff;
  }
  .close-btn {
    border: none;
    background: transparent;
    width: 28px; height: 28px;
    border-radius: 0;
    font-size: 22px;
    font-weight: 400;
    line-height: 28px;
    cursor: pointer;
    color: rgba(238,242,245,.5);
    flex: 0 0 auto;
    box-shadow: none;
  }
  .close-btn:hover { color: rgba(238,242,245,.88); }

  .panel-body {
    padding: 12px 14px 20px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
  }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
    background: #4d6573;
    color: #e8eef2;
  }
  .chip.pe { background: #0f7aa6; color: #5ad2ff; }
  .chip.hol { background: var(--holiday); color: var(--holiday-ink); }
  .chip.cyc { background: #5a5668; color: #ff7ad9; }

  h3.sec {
    font-size: 11px;
    font-weight: 700;

<script>
async function boot() {
  let data = null;
  try {
    const res = await fetch("school-calendar-data.json", { cache: "no-store" });
    if (res.ok) data = await res.json();
  } catch (e) {}
  if (!data && window.SCHOOL_DATA) data = window.SCHOOL_DATA;
  if (!data) {
    const note = document.createElement("p");
    note.style.cssText = "margin:16px;padding:12px 14px;background:#3d2a32;color:#ffe566;font:14px/1.45 Outfit,sans-serif;";
    note.textContent = "Could not load school-calendar-data.json. Keep that file beside this page. If you open the HTML directly, also keep school-calendar-data.js beside it, or serve the folder (python3 -m http.server).";
    document.body.prepend(note);
    return;
  }
  window.__CAL = data;
  start();
}

function start() {
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_SHORT = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DATA = window.__CAL || {};
const TERM_MARKS = new Set(DATA.marks && DATA.marks.term || ["T1","T2","E1","E2"]);
const ORANGE_MARKS = new Set(DATA.marks && DATA.marks.orange || ["M","TSA","PC"]);

const PE_DAYS = new Set(DATA.peDays || []);
const PE_DATES = new Set(DATA.peDates || []);
const RSJ_DAYS = DATA.rsjDays || {};
function isPeIconDay(key, info) {
  return PE_DATES.has(key) || !!(info && info.dn && PE_DAYS.has(info.dn));
}
const ASA_RECESS_T = (DATA.asa && DATA.asa.recess) || "15:25–15:45";
const ASA_ACT_T = (DATA.asa && DATA.asa.activity) || "15:45–17:45";
const NO_ASA_TAGS = new Set((DATA.asa && DATA.asa.noAsaTags) || []);
function isAfterSchoolDay(key) {
  const info = DAYS[key] || {};
  if (!info.dn || info.half || info.summer) return false;
  if (!isSchoolSessionDay(key)) return false;
  if (NO_ASA_TAGS.has(info.tag) || TERM_MARKS.has(info.tag)) return false;
  const notes = typeof eventsFor === "function" ? eventsFor(key) : [];
  if (notes.some(ev => /sports day|swimming gala|\bpicnic\b/i.test(ev.text))) return false;
  return true;
}
function isBadmintonDay(key) {
  if (!isAfterSchoolDay(key)) return false;
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).getDay() === 2;
}
function afterSchoolSlot(key) {
  if (!isBadmintonDay(key)) return null;
  return {t: ASA_ACT_T, s: "BADM"};
}
function dayLessons(key) {
  const info = DAYS[key] || {};
  const rows = (info.dn && TIMETABLE[info.dn]) ? TIMETABLE[info.dn].slice() : [];
  if (!isAfterSchoolDay(key)) return rows;
  rows.push({t: ASA_RECESS_T, break: "After School Recess"});
  const slot = afterSchoolSlot(key);
  if (slot) rows.push(slot);
  return rows;
}
const UNIFORM = DATA.uniform || {};
const WX = {};
const WX_API = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=en";
const WX_GIS = new Set([50,51,52,53,54,60,62,63,70,71,72,73,74,75,76,77]);
const WX_GIS_ALIAS = {61:60, 64:63, 65:63};
const WX_ICON = id => {
  const n = WX_GIS.has(id) ? id : WX_GIS_ALIAS[id];
  if (n != null) return `https://www.hko.gov.hk/en/wxinfo/awsgis/images/${n}.png`;
  return `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${id}.png`;
};
function wxImg(key, cls) {
  const w = WX[key];
  if (!w) return "";
  const tip = [w.desc, w.min != null ? `${w.min}–${w.max}°C` : ""].filter(Boolean).join(" · ");
  return `<img class="${cls || "wx-icon"}" src="${WX_ICON(w.icon)}" alt="${w.desc || ""}" title="${tip}">`;
}
function paintWeather() {
  document.querySelectorAll(".cell[data-key]").forEach(cell => {
    const html = wxImg(cell.dataset.key, "wx-icon");
    if (!html || cell.querySelector(".cell-wx .wx-icon, .cell-icos > .wx-icon")) return;
    let box = cell.querySelector(".cell-wx");
    if (!box) {
      box = document.createElement("div");
      box.className = "cell-wx";
      cell.appendChild(box);
    }
    box.innerHTML = html;
  });
  const sel = document.querySelector(".cell.selected");
  if (sel) openDay(sel.dataset.key, sel);
  if (document.getElementById("app") && document.getElementById("app").classList.contains("view-tt")) {
    buildTimetable();
  }
}
async function loadWeather() {
  try {
    const [fnd, now, flw] = await Promise.all([
      fetch(WX_API).then(r => r.json()),
      fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en").then(r => r.json()).catch(() => null),
      fetch("https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=en").then(r => r.json()).catch(() => null)
    ]);
    (fnd.weatherForecast || []).forEach(f => {
      const raw = String(f.forecastDate || "");
      if (raw.length !== 8) return;
      const key = `${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;
      WX[key] = {
        icon: f.ForecastIcon,
        desc: f.forecastWeather || "",
        max: f.forecastMaxtemp && f.forecastMaxtemp.value,
        min: f.forecastMintemp && f.forecastMintemp.value
      };
    });
    syncToday();
    if (now && now.icon && now.icon[0]) {
      const temps = (now.temperature && now.temperature.data) || [];
      const hko = temps.find(x => x.place === "Hong Kong Observatory") || temps[0];
      WX[TODAY] = {
        icon: now.icon[0],
        desc: (flw && (flw.forecastDesc || flw.forecastPeriod)) || "Now",
        max: hko && hko.value,
        min: hko && hko.value
      };
    }
    paintWeather();
  } catch (e) {}
}

const SUBJECTS = DATA.subjects || {};
const TIMETABLE = DATA.timetable || {};
const DAYS = DATA.days || {};
const EVENTS = DATA.events || [];
const TAG_LABEL = DATA.tagLabels || {};

function assignCycles() {
  const keys = Object.keys(DAYS).filter(k => DAYS[k].dn).sort();
  let c = 0;
  keys.forEach(k => {
    if (DAYS[k].dn === 1) c += 1;
    DAYS[k].cycle = c;
  });
}
assignCycles();

function bookMark(letter, title) {
  if (letter === "E") {
    return `<span class="book-mark${title ? " title" : ""}">${BOOK_ENG}</span>`;

}

function iso(y,m,day){ return `${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`; }
function nextIso(key) {
  const [y,m,d] = key.split("-").map(Number);
  const nd = new Date(y, m-1, d+1);
  return iso(nd.getFullYear(), nd.getMonth()+1, nd.getDate());
}
function isWeekendKey(key) {
  const [y,m,d] = key.split("-").map(Number);
  const dow = new Date(y, m-1, d).getDay();
  return dow === 0 || dow === 6;
}
function isHolidayKey(key) {
  return !!(DAYS[key] && DAYS[key].holiday);
}
function isSchoolSessionDay(key) {
  return !isWeekendKey(key) && !isHolidayKey(key);
}
function isHolidayEvent(ev) {
  return /holiday/i.test(ev.text);
}
function eventSpansAllDays(ev) {
  return !!(ev.spanAll || isHolidayEvent(ev));
}
function datesInRange(start, end) {
  const out = [];
  for (let k = start; k <= end; k = nextIso(k)) out.push(k);
  return out;
}
function schoolDaysInRange(start, end) {
  return datesInRange(start, end).filter(isSchoolSessionDay);
}
function fmtDays(keys) {
  if (!keys.length) return "";
  const days = keys.map(k => Number(k.slice(8)));
  const parts = [];
  let a = days[0], b = days[0];
  for (let i = 1; i <= days.length; i++) {
    if (i < days.length && days[i] === b + 1) { b = days[i]; continue; }
    parts.push(a === b ? String(a) : `${a}–${b}`);
    if (i < days.length) { a = b = days[i]; }
  }
  return parts.join(", ");
}
function fmtRange(start, end) {
  const s = start.slice(8), e = end.slice(8);
  if (start === end) return String(Number(s));
  return `${Number(s)}–${Number(e)}`;
}
function eventAppliesToDay(ev, key) {
  if (!(ev.start <= key && key <= ev.end)) return false;
  if (ev.start === ev.end || eventSpansAllDays(ev)) return true;
  return isSchoolSessionDay(key);
}
function eventsFor(key) {
  return EVENTS.filter(ev => eventAppliesToDay(ev, key));
}
function noteRangeLabel(ev, y, m) {
  const prefix = `${y}-${String(m).padStart(2,"0")}`;
  const monthStart = `${prefix}-01`;
  const last = new Date(y, m, 0).getDate();
  const monthEnd = `${prefix}-${String(last).padStart(2,"0")}`;
  const from = ev.start > monthStart ? ev.start : monthStart;
  const to = ev.end < monthEnd ? ev.end : monthEnd;
  if (from === to) return String(Number(from.slice(8)));
  if (eventSpansAllDays(ev)) return fmtRange(from, to);
  return fmtDays(schoolDaysInRange(from, to));
}

function hongKongIso(d) {
  try {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Hong_Kong" }).format(d || new Date());
  } catch (e) {
    const x = d || new Date();
    return iso(x.getFullYear(), x.getMonth() + 1, x.getDate());
  }
}
let TODAY = hongKongIso();
function applyToday(key) {
  if (!key || key === TODAY) return;
  const prev = TODAY;
  TODAY = key;
  document.querySelectorAll(".cell.today").forEach(c => c.classList.remove("today"));
  const monthCell = document.querySelector(`.cal-wrap .cell[data-key="${key}"]`);
  if (monthCell) monthCell.classList.add("today");
  document.querySelectorAll(".tt-table .today-col").forEach(el => {
    if (el.dataset.key !== key) el.classList.remove("today-col");
  });
  document.querySelectorAll(`.tt-table [data-key="${key}"]`).forEach(el => el.classList.add("today-col"));
  if (prev && WX[prev] && !WX[key]) WX[key] = WX[prev];

  const panelOpen = app.classList.contains("open-panel");
  const shown = (panel && panel.dataset.key) || "";
  const selectedKey = selectedCell && selectedCell.dataset.key;
  const showingPrevToday = shown === prev || selectedKey === prev;
  const noSelection = !selectedCell;
  if (panelOpen && (showingPrevToday || (noSelection && (!shown || shown === prev)))) {
    const weekHead = document.querySelector(`.tt-table thead th[data-key="${key}"]`);
    openDay(key, monthCell || weekHead || selectedCell);
  }
  loadWeather();
}
function syncToday() {
  applyToday(hongKongIso());
}

const monthList = (DATA.months || [[2026,9],[2026,10],[2026,11],[2026,12],[2027,1],[2027,2],[2027,3],[2027,4],[2027,5],[2027,6],[2027,7],[2027,8]]);

const monthsEl = document.getElementById("months");
monthList.forEach(([y,m]) => {
  const first = new Date(y, m-1, 1);
  const startDow = first.getDay();
  const lastDate = new Date(y, m, 0).getDate();
  const sec = document.createElement("section");
  sec.className = "month";
  sec.dataset.ym = `${y}-${String(m).padStart(2,"0")}`;
  const bg = document.createElement("div");
  bg.className = "month-bg";
  bg.setAttribute("aria-hidden", "true");
  bg.textContent = String(m);
  sec.appendChild(bg);
  const grid = document.createElement("div");
  grid.className = "grid";
  for (let i=0;i<startDow;i++) {
    const e = document.createElement("div");
    e.className = "cell empty";
    grid.appendChild(e);
  }
  for (let day=1; day<=lastDate; day++) {
    const key = iso(y,m,day);
    const info = DAYS[key] || {};
    const dt = new Date(y, m-1, day);
    const weekend = dt.getDay()===0 || dt.getDay()===6;
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.key = key;
    cell.dataset.dow = String(dt.getDay());
    const session = isSchoolSessionDay(key);
    if (info.holiday) cell.classList.add("holiday");
    else if (TERM_MARKS.has(info.tag) && session) cell.classList.add("exam");

    .sort((a, b) => a[0] < b[0] ? -1 : 1)

function scrollWeekToIndex(idx, behavior, how) {
  const sc = document.getElementById("ttScroll");
  if (!sc) return;
  idx = Math.max(0, Math.min(YEAR_KEYS.length - 1, idx | 0));
  const pad = ttTimeW + 6;
  let left = idx * ttColW;
  if (how === "center") {
    const view = Math.max(80, sc.clientWidth - pad);
    left = idx * ttColW - (view - ttColW) / 2;

  left = Math.max(0, left);

  // scrollTo({behavior:"smooth"}) is cancelled by browsers if the table
  // innerHTML is rebuilt mid-animation — which happens as soon as the
  // scroll leaves the originally populated window. Mount the destination
  // window first, and only keep a smooth animation when the target is
  // already on-screen (or just about to be).
  const alreadyMounted = ttWinStart >= 0 && idx >= ttWinStart && idx < ttWinEnd;
  const nearby = alreadyMounted && Math.abs((sc.scrollLeft || 0) - left) < Math.max(sc.clientWidth, ttColW * 8);
  const [winStart, winEnd] = ttWindowRange(left, sc.clientWidth);
  if (winStart !== ttWinStart || winEnd !== ttWinEnd) {
    mountTtWindow(winStart, winEnd, true);

  const max = Math.max(0, (sc.scrollWidth || ttVirtWidth || ttTotalWidth()) - sc.clientWidth);

  const useSmooth = behavior === "smooth" && nearby;

    // while the virtual width is applied; snap again on the next frame.

function updateMonthThumb() {

  if (!btns.length) return;
  const anchors = [];
  btns.forEach(btn => {
    const pos = firstOfMonthScrollPos(btn.dataset.ym);
    if (pos == null) return;
    anchors.push({
      ym: btn.dataset.ym,
      pos,
      center: btn.offsetLeft + btn.offsetWidth / 2,
      width: btn.offsetWidth,
      height: btn.offsetHeight
    });
  });
  if (!anchors.length) {
    const b = btns[0];

  const s = currentBoardScroll();
  let i = 0;
  while (i < anchors.length - 1 && s >= anchors[i + 1].pos) i++;
  let center, width, height, ym;
  if (s <= anchors[0].pos) {
    center = anchors[0].center;
    width = anchors[0].width;
    height = anchors[0].height;
    ym = anchors[0].ym;
  } else if (s >= anchors[anchors.length - 1].pos) {
    const a = anchors[anchors.length - 1];
    center = a.center;

    stage.innerHTML = sizes.map(s => `<div class="widget-cap">${s}</div>${renderWidget(s, TODAY)}`).join("");
  }
}

}
boot();
</script>
</body>
</html>
